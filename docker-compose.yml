version: '3'

services:
  db:
    image: postgres:latest
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
    networks:
      - backend
  redis:
    image: "redis:alpine"
    networks:
      - backend

volumes:
  postgres_data:

networks:
  backend:
    driver: bridge
